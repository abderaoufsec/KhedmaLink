# Alembic Configuration File
# Used for database migrations in KhedmaLink backend

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = Africa/Algiers

# Truncate long revision descriptions
truncate_slug_length = 40

# Version path separator (default: os.pathsep)
# version_path_separator = os

# Output encoding
# output_encoding = utf-8

# Database URL - will be overridden by env.py
# sqlalchemy.url = postgresql://khedmalink_user:khedmalink_password@localhost:5432/khedmalink

[post_write_hooks]
# Hooks to run after migration generation
# post_write_hooks = hooks

[loggers]
keys = root,sqlalchemy,alembic

[logger_root]
level = WARN
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handlers]
# Define handlers if needed
# keys = console

# KhedmaLink CI/CD Pipeline
# This workflow runs on every pull request and push to main/develop branches
# It ensures code quality, runs tests, and builds the application

name: CI/CD Pipeline

# Trigger conditions
on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/milestone-*'
  push:
    branches:
      - main
      - develop
  workflow_dispatch:  # Allow manual triggering

# Environment variables
env:
  FLUTTER_VERSION: '3.24.0'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # =============================================================================
  # JOB 1: Flutter Frontend Checks
  # =============================================================================
  flutter-checks:
    name: Flutter Frontend Checks
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      # Step 2: Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      # Step 3: Get Flutter dependencies
      - name: Get Flutter dependencies
        run: |
          cd frontend
          flutter pub get
      
      # Step 4: Flutter format check
      - name: Flutter format check
        run: |
          cd frontend
          dart format --set-exit-if-changed .
      
      # Step 5: Flutter analyze
      - name: Flutter analyze
        run: |
          cd frontend
          flutter analyze --no-fatal-infos
      
      # Step 6: Flutter unit tests
      - name: Flutter unit tests
        run: |
          cd frontend
          flutter test --coverage
      
      # Step 7: Upload Flutter coverage
      - name: Upload Flutter coverage
        uses: codecov/codecov-action@v3
        with:
          files: frontend/coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
      
      # Step 8: Flutter Android build (validation)
      - name: Flutter Android build
        run: |
          cd frontend
          flutter build apk --debug
      
      # Step 9: Flutter Web build (validation)
      - name: Flutter Web build
        run: |
          cd frontend
          flutter build web --release

  # =============================================================================
  # JOB 2: Python Backend Checks
  # =============================================================================
  python-checks:
    name: Python Backend Checks
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      # Step 3: Install Python dependencies
      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      # Step 4: Python linting with Ruff
      - name: Python linting (Ruff)
        run: |
          cd backend
          ruff check . --exit-zero
      
      # Step 5: Python formatting check with Black
      - name: Python formatting check (Black)
        run: |
          cd backend
          black --check . --diff
        continue-on-error: true
      
      # Step 6: Python type checking with MyPy
      - name: Python type checking (MyPy)
        run: |
          cd backend
          mypy app/ --strict
        continue-on-error: true  # Don't fail CI on type errors initially
      
      # Step 7: Python security check with Bandit
      - name: Python security check (Bandit)
        run: |
          cd backend
          bandit -r app/ -f json -o bandit-report.json
        continue-on-error: true
      
      # Step 8: Upload security report
      - name: Upload security report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json
      
      # Step 9: Python unit tests
      - name: Python unit tests
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --tb=short
        continue-on-error: true
      
      # Step 10: Upload Python coverage
      - name: Upload Python coverage
        uses: codecov/codecov-action@v3
        with:
          files: backend/coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
      
      # Step 11: Upload test results
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: python-test-results
          path: backend/htmlcov/

  # =============================================================================
  # JOB 3: Database Migration Check
  # =============================================================================
  database-checks:
    name: Database Migration Check
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic psycopg2-binary
      
      # Step 4: Run database migrations
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          cd backend
          alembic upgrade head
      
      # Step 5: Check migration status
      - name: Check migration status
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          cd backend
          alembic current
          alembic history

  # =============================================================================
  # JOB 4: Documentation Check
  # =============================================================================
  documentation-checks:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Check for broken links in documentation
      - name: Check for broken links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          check-modified-files-only: 'yes'
        continue-on-error: true
      
      # Step 3: Validate Markdown files
      - name: Validate Markdown
        run: |
          find docs -name "*.md" -exec echo "Checking {}" \;
      
      # Step 4: Check for TODO/FIXME comments
      - name: Check for TODO/FIXME
        run: |
          grep -r "TODO\|FIXME" frontend/ backend/ || echo "No TODO/FIXME found"
        continue-on-error: true

  # =============================================================================
  # JOB 5: Security Scanning
  # =============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Run Trivy vulnerability scanner
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      # Step 3: Upload Trivy results to GitHub Security
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      # Step 4: Check for secrets
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # =============================================================================
  # JOB 6: Build and Deploy (only on main/develop)
  # =============================================================================
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [flutter-checks, python-checks, database-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Step 3: Login to Docker Hub (if configured)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.ref == 'refs/heads/main'
      
      # Step 4: Build and tag Docker images
      - name: Build Docker images
        run: |
          docker build -t khedmalink-backend:${{ github.sha }} -f backend/Dockerfile ./backend
          docker build -t khedmlink-frontend:${{ github.sha }} -f frontend/Dockerfile ./frontend
      
      # Step 5: Push images (only on main)
      - name: Push Docker images
        run: |
          docker tag khedmalink-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/khedmalink-backend:latest
          docker tag khedmalink-frontend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/khedmalink-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/khedmalink-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/khedmalink-frontend:latest
        if: github.ref == 'refs/heads/main'

  # =============================================================================
  # JOB 7: Notification (on failure)
  # =============================================================================
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [flutter-checks, python-checks, database-checks, security-scan]
    if: failure()
    
    steps:
      # Step 1: Send notification
      - name: Send failure notification
        run: |
          echo "CI/CD Pipeline failed for ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          # Add actual notification logic here (Slack, email, etc.)

# =============================================================================
# NOTES
# =============================================================================
# 
# This CI/CD pipeline is designed to:
# 1. Ensure code quality through automated checks
# 2. Run comprehensive tests for both frontend and backend
# 3. Validate database migrations
# 4. Perform security scanning
# 5. Build and deploy on successful merges to main/develop
# 6. Provide notifications on failures
#
# The pipeline will be enhanced as the project progresses:
# - Add E2E tests when UI is available
# - Add performance testing
# - Add integration tests
# - Add deployment to staging/production environments
# - Add rollback capabilities
#
# Milestone-specific checks will be added as each milestone is implemented.
